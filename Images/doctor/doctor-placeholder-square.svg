<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 20 980 980" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4EE"/>
      <stop offset="1" stop-color="#F7F3E6"/>
    </linearGradient>
    <linearGradient id="coatL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3E9EC"/>
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7F8"/>
    </linearGradient>
    <linearGradient id="coatR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#DCE3E7"/>
      <stop offset="0.35" stop-color="#FBFCFC"/>
      <stop offset="1" stop-color="#EEF2F4"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFD8EC"/>
      <stop offset="1" stop-color="#A9C8E2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F6F7"/>
      <stop offset="0.5" stop-color="#B9C2C7"/>
      <stop offset="1" stop-color="#7E8A91"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9805E"/>
      <stop offset="1" stop-color="#A06A4C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E3A30" flood-opacity="0.16"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="-200" y="-100" width="1200" height="1300" fill="url(#bg)"/>
  <circle cx="400" cy="560" r="360" fill="#F2C94C" opacity="0.22"/>
  <circle cx="400" cy="560" r="300" fill="#F2C94C" opacity="0.18"/>
  <!-- leaf motif -->
  <g opacity="0.55">
    <path d="M95 300 C 60 200, 130 120, 230 110 C 235 210, 170 290, 95 300 Z" fill="#9CCBA8"/>
    <path d="M95 300 C 140 230, 180 170, 228 115" stroke="#7DB38D" stroke-width="4" fill="none"/>
    <path d="M705 300 C 740 200, 670 120, 570 110 C 565 210, 630 290, 705 300 Z" fill="#9CCBA8"/>
    <path d="M705 300 C 660 230, 620 170, 572 115" stroke="#7DB38D" stroke-width="4" fill="none"/>
  </g>

  <g filter="url(#soft)" transform="translate(0 -70)">
    <!-- shirt base -->
    <path d="M340 215 Q400 250 460 215 L475 520 L424 1100 L376 1100 L325 520 Z" fill="url(#shirt)"/>
    <!-- shirt buttons -->
    <circle cx="400" cy="330" r="6" fill="#F2F7FB"/>
    <circle cx="400" cy="430" r="6" fill="#F2F7FB"/>
    <circle cx="400" cy="530" r="6" fill="#F2F7FB"/>
    <path d="M400 260 L400 1100" stroke="#9DBBD4" stroke-width="2"/>

    <!-- coat halves -->
    <path d="M22 1100 L52 430 Q66 300 228 255 L340 213 L362 300 L326 520 L404 1100 Z" fill="url(#coatL)"/>
    <path d="M778 1100 L748 430 Q734 300 572 255 L460 213 L438 300 L474 520 L396 1100 Z" fill="url(#coatR)"/>

    <!-- lapels -->
    <path d="M340 213 L296 248 L262 330 L300 360 L270 420 L326 520 L362 300 Z" fill="#F1F5F6"/>
    <path d="M460 213 L504 248 L538 330 L500 360 L530 420 L474 520 L438 300 Z" fill="#EAF0F2"/>
    <path d="M262 330 L300 360 L270 420" stroke="#C9D3D8" stroke-width="3" fill="none"/>
    <path d="M538 330 L500 360 L530 420" stroke="#C9D3D8" stroke-width="3" fill="none"/>
    <path d="M326 520 L362 300" stroke="#C9D3D8" stroke-width="3"/>
    <path d="M474 520 L438 300" stroke="#C9D3D8" stroke-width="3"/>

    <!-- arm / fold lines -->
    <path d="M140 470 Q150 760 138 1100" stroke="#D5DDE1" stroke-width="4" fill="none"/>
    <path d="M660 470 Q650 760 662 1100" stroke="#D5DDE1" stroke-width="4" fill="none"/>

    <!-- coat buttons -->
    <circle cx="326" cy="720" r="9" fill="#E1E7EA" stroke="#C3CDD2" stroke-width="2"/>
    <circle cx="342" cy="860" r="9" fill="#E1E7EA" stroke="#C3CDD2" stroke-width="2"/>

    <!-- breast pocket (doctor's left) with pens -->
    <rect x="590" y="505" width="14" height="80" rx="6" fill="#1F6B4F"/>
    <rect x="590" y="505" width="14" height="14" rx="6" fill="#16503B"/>
    <rect x="614" y="520" width="12" height="70" rx="5" fill="#E2B33A"/>
    <rect x="612" y="530" width="4" height="40" rx="2" fill="#B98C22"/>
    <path d="M565 560 L685 560 L680 670 Q625 680 570 670 Z" fill="#F3F6F7" stroke="#C9D3D8" stroke-width="3"/>
    <path d="M575 572 L675 572" stroke="#D5DDE1" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- ID badge (doctor's right) -->
    <g transform="translate(150 560) rotate(-3)">
      <rect x="44" y="-38" width="12" height="44" rx="3" fill="#1F6B4F"/>
      <rect x="0" y="0" width="100" height="130" rx="12" fill="#FFFFFF" stroke="#C9D3D8" stroke-width="3"/>
      <rect x="0" y="0" width="100" height="36" rx="12" fill="#1F6B4F"/>
      <rect x="0" y="22" width="100" height="14" fill="#1F6B4F"/>
      <circle cx="50" cy="70" r="20" fill="#E8F2EC"/>
      <path d="M50 58 L50 82 M38 70 L62 70" stroke="#1F6B4F" stroke-width="7" stroke-linecap="round"/>
      <rect x="20" y="100" width="60" height="7" rx="3.5" fill="#D5DDE1"/>
      <rect x="30" y="112" width="40" height="6" rx="3" fill="#E4E9EC"/>
    </g>

    <!-- stethoscope tubing -->
    <g fill="none" stroke-linecap="round">
      <path d="M318 640 C 300 520, 300 340, 345 235 C 370 195, 430 195, 455 235 C 500 330, 520 440, 515 560"
            stroke="#173F33" stroke-width="15"/>
      <path d="M318 640 C 300 520, 300 340, 345 235 C 370 195, 430 195, 455 235 C 500 330, 520 440, 515 560"
            stroke="#2E6B57" stroke-width="7" opacity="0.6"/>
      <!-- Y split to earpieces -->
      <path d="M515 560 C 510 610, 488 640, 480 700" stroke="#173F33" stroke-width="12"/>
      <path d="M515 560 C 522 610, 548 640, 556 700" stroke="#173F33" stroke-width="12"/>
      <path d="M480 700 C 476 740, 472 760, 470 780" stroke="url(#metal)" stroke-width="7"/>
      <path d="M556 700 C 560 740, 566 760, 568 780" stroke="url(#metal)" stroke-width="7"/>
    </g>
    <rect x="505" y="548" width="20" height="26" rx="6" fill="url(#metal)"/>
    <ellipse cx="470" cy="790" rx="11" ry="13" fill="#173F33"/>
    <ellipse cx="568" cy="790" rx="11" ry="13" fill="#173F33"/>

    <!-- chest piece -->
    <g filter="url(#tiny)">
      <rect x="310" y="630" width="16" height="40" rx="6" fill="url(#metal)"/>
      <circle cx="318" cy="712" r="46" fill="url(#metal)"/>
      <circle cx="318" cy="712" r="36" fill="#E9EDEF" stroke="#9AA6AC" stroke-width="3"/>
      <circle cx="318" cy="712" r="22" fill="#F2C94C" opacity="0.9"/>
      <circle cx="318" cy="712" r="8" fill="#C79B25"/>
    </g>

    <!-- neck (drawn over tubing so it sits behind the neck) -->
    <path d="M352 0 L448 0 L452 214 Q400 248 348 214 Z" fill="url(#skin)"/>
    <path d="M352 70 L448 70 L448 120 Q400 150 352 120 Z" fill="#8F5D42" opacity="0.4"/>

    <!-- shirt collar -->
    <path d="M343 205 L400 256 L370 298 L326 236 Z" fill="#DCEAF5" stroke="#9DBBD4" stroke-width="2"/>
    <path d="M457 205 L400 256 L430 298 L474 236 Z" fill="#D3E4F2" stroke="#9DBBD4" stroke-width="2"/>
  </g>
</svg>
